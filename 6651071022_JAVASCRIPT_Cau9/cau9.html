<!DOCTYPE html>
<html><head>
<meta charset="utf-8" />
<title>Form Validation Exercise</title>
<link rel="stylesheet" href="Styles/cau9.css">
</head><body>
<h3>Personal Information</h3>
<form id="frm" novalidate>
<table>
<tr><td>Enter name*:</td><td><input type="text" id="name"></td></tr>
<tr><td>Sex*:</td><td><label><input type="radio" name="sex" value="M"> Male</label>
  <label><input type="radio" name="sex" value="F"> Female</label></td></tr>
<tr><td>Enter email address*:</td><td><input type="text" id="email"></td></tr>
<tr><td>Enter birthday (MM/DD/YYYY)*:</td><td><input type="text" id="birthday" placeholder="mm/dd/yyyy"></td></tr>
<tr><td>Enter street address (line 1)*:</td><td><input type="text" id="address"></td></tr>
<tr><td>Enter city*:</td><td><input type="text" id="city"></td></tr>
<tr><td>Select a region*:</td><td><select id="region">
  <option value="">-- Select --</option>
  <option>North</option><option>Central</option><option>South</option></select></td></tr>
<tr><td>Enter 5-digit ZIP code*:</td><td><input type="text" id="zip" maxlength="5"></td></tr>
<tr><td></td><td><button type="submit" id="btnFinish">Finish</button>
  <button type="button" id="btnClear">Clear</button></td></tr>
</table>
</form>
<script src="Scripts/jquery-3.7.1.min.js"></script>
<script>window.jQuery || document.write('<script src="https://code.jquery.com/jquery-3.7.1.min.js"><\/script>')</script>
<script src="Scripts/cau9.js"></script>
</body></html>
